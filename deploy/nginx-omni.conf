# omni.re-l.ru -> 10005, api.omni.re-l.ru -> 10006
# Certificates are expected at /etc/letsencrypt/live/<host>/

upstream omni_web {
    server 127.0.0.1:10005;
}

upstream omni_api {
    server 127.0.0.1:10006;
}

server {
    listen 192.168.0.167:80;
    listen 172.17.0.1:80;
    listen 192.168.0.246:80;
    server_name omni.re-l.ru api.omni.re-l.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/re_l_ru_usr/data/www/omni.re-l.ru;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 192.168.0.167:443 ssl;
    listen 172.17.0.1:443 ssl;
    listen 192.168.0.246:443 ssl;
    server_name omni.re-l.ru;

    ssl_certificate /etc/letsencrypt/live/omni.re-l.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omni.re-l.ru/privkey.pem;

    client_max_body_size 24m;

    location / {
        proxy_pass http://omni_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 192.168.0.167:443 ssl;
    listen 172.17.0.1:443 ssl;
    listen 192.168.0.246:443 ssl;
    server_name api.omni.re-l.ru;

    ssl_certificate /etc/letsencrypt/live/api.omni.re-l.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.omni.re-l.ru/privkey.pem;

    client_max_body_size 24m;

    location / {
        proxy_pass http://omni_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
